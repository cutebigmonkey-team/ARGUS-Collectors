name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock build==1.3.0 PyYAML==6.0.3
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_boundary.py
      - run: python scripts/check_workflows.py
      - run: python -m build
      - name: Verify installed wheel independently of the source tree
        run: |
          python -m venv /tmp/argus-wheel
          /tmp/argus-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/argus-wheel/bin/python -c 'from argus_collectors import collect; from argus_collectors.journal import Journal'
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan complete public history without printing secrets
        run: gitleaks git --redact --no-banner --log-opts='--all' .
      - run: gitleaks dir --redact --no-banner .
